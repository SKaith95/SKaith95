<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FD843C"/><stop offset="1" stop-color="#FD5D57"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FD843C" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FD843C"/>
      <stop offset="1" stop-color="#FD5D57" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>
    .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
    .up { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; }
    .grow { stroke-dasharray: 520; stroke-dashoffset: 520; animation: grow 1.4s .9s ease-out forwards; }
    .shine { animation: shine 4s 1.6s ease-in-out infinite; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(140px,40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-160px,-30px); } }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { stroke-dashoffset: 0; } }
    @keyframes shine { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="#060B24"/>
    <circle class="blob1" cx="250" cy="90" r="190" fill="#FD843C" opacity=".38" filter="url(#blur)"/>
    <circle class="blob2" cx="980" cy="260" r="170" fill="#FD5D57" opacity=".28" filter="url(#blur)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#FD843C" stroke-opacity=".25"/>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text class="up d1" x="600" y="102" font-size="16" font-weight="600" letter-spacing="6" fill="#FD843C">EPITECH · PREMIÈRE ANNÉE</text>
    <text class="up d2" x="600" y="190" font-size="84" font-weight="800" fill="#ffffff">Kais</text>
    <text class="up d3" x="600" y="242" font-size="22" fill="#C9CCDA">Étudiant développeur · Créateur de <tspan fill="url(#orange)" font-weight="700">Tandem</tspan></text>
  </g>
  <line class="grow" x1="340" y1="276" x2="860" y2="276" stroke="url(#line)" stroke-width="2"/>
  <circle class="shine" cx="600" cy="276" r="3.5" fill="#FD843C"/>
</svg>

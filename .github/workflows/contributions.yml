name: Cartes du profil

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (joueurs en ligne)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/scripts/**, .github/workflows/contributions.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer les cartes (contributions et jeux)
        run: |
          mkdir -p dist
          python3 .github/scripts/contributions.py "${{ github.repository_owner }}" dist
          python3 .github/scripts/jeux.py dist
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

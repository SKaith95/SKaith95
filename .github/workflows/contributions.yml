name: Cartes du profil

# Une fois par heure : visites, favoris, j'aime et carte des contributions.
# Les joueurs en ligne sont affichés en direct par un badge dans le README.
on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/scripts/**, .github/workflows/contributions.yml]

permissions:
  contents: write

concurrency:
  group: cartes-du-profil
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le passage précédent
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: output
          path: precedent

      - name: Générer les cartes (contributions et jeux)
        run: |
          mkdir -p dist
          python3 .github/scripts/contributions.py "${{ github.repository_owner }}" dist --precedent precedent
          python3 .github/scripts/jeux.py dist --precedent precedent

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
